<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>Olymp Florbal Tréninky</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="description" content="Sestavovač florbalových tréninků, knihovna aktivit a 20týdenní plán pro trenéra Olymp Florbal.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Olymp Tréninky">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<style>
/* ============ Tokeny ============ */
:root{
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --bg:#f2f2f7; --card:#ffffff; --card2:#f2f2f7; --fill:rgba(118,118,128,.14);
  --text:#1c1c1e; --text2:#636366;
  --sep:rgba(60,60,67,.16); --sep-strong:rgba(60,60,67,.34);
  --accent:#d91f26; --accent-press:#b5181e; --accent-text:#c4161c; --accent-bg:rgba(217,31,38,.09); --on-accent:#fff;
  --warm:#a85a00;  --warm-bg:rgba(255,149,0,.16);
  --drill:#0a62c9; --drill-bg:rgba(10,98,201,.11);
  --game:#1a7f37;  --game-bg:rgba(26,127,55,.12);
  --ok:#1a7f37; --ok-bg:rgba(26,127,55,.12); --warn:#a85a00; --warn-bg:rgba(255,149,0,.18); --info:#0a62c9; --info-bg:rgba(10,98,201,.11);
  --hdr-bg:rgba(242,242,247,.74); --scrim:rgba(0,0,0,.38);
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 6px 20px rgba(0,0,0,.06);
  --shadow-lift:0 14px 34px rgba(0,0,0,.26), 0 3px 8px rgba(0,0,0,.18);
  --r:16px; --r-sm:12px;
  --hdr-h:104px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --card2:#2c2c2e; --fill:rgba(118,118,128,.28);
    --text:#f5f5f7; --text2:#a1a1a6;
    --sep:rgba(84,84,88,.6); --sep-strong:rgba(120,120,128,.7);
    --accent:#e5343b; --accent-press:#c92a30; --accent-text:#ff6b71; --accent-bg:rgba(255,69,76,.16);
    --warm:#ffb040; --warm-bg:rgba(255,159,10,.18);
    --drill:#5eb0ff; --drill-bg:rgba(10,132,255,.2);
    --game:#4cd270; --game-bg:rgba(48,209,88,.16);
    --ok:#4cd270; --ok-bg:rgba(48,209,88,.16); --warn:#ffb040; --warn-bg:rgba(255,159,10,.2); --info:#5eb0ff; --info-bg:rgba(10,132,255,.2);
    --hdr-bg:rgba(0,0,0,.62); --scrim:rgba(0,0,0,.56);
    --shadow:0 1px 2px rgba(0,0,0,.4);
    --shadow-lift:0 14px 34px rgba(0,0,0,.6), 0 3px 8px rgba(0,0,0,.5);
  }
}
@media (prefers-contrast: more){
  :root{ --text2:var(--text); --sep:rgba(0,0,0,.62); --sep-strong:#000; --accent-text:#8f0d12; --card2:#e8e8ed; }
  .card,.block,.gcard,.lcard,.week,.ccard,.sheet,.toast,.next,.prow,.arow,.chip,.btn,.seg,.mini-seg,.pill{ border:1px solid var(--sep-strong) !important; }
}
@media (prefers-contrast: more) and (prefers-color-scheme: dark){
  :root{ --sep:rgba(255,255,255,.7); --sep-strong:#fff; --accent-text:#ff9a9e; --card2:#2c2c2e; }
}
@media (prefers-reduced-transparency: reduce){
  .hdr{ background:var(--bg) !important; -webkit-backdrop-filter:none !important; backdrop-filter:none !important; }
  .scrim{ background:rgba(0,0,0,.6) !important; }
}

/* ============ Základ ============ */
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; overscroll-behavior:none; background:var(--bg); }
body{
  margin:0; min-height:100dvh; overscroll-behavior:none;
  font:400 16px/1.4 var(--font); color:var(--text); background:var(--bg);
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{ margin:0; letter-spacing:-.022em; line-height:1.2; font-weight:700; }
p{ margin:0; }
button,input,textarea{ font:inherit; color:inherit; }
button{ background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:inherit; }
svg{ display:block; flex:none; }
:focus-visible{ outline:2px solid var(--accent-text); outline-offset:2px; border-radius:6px; }

/* ovládací prvky: žádné výběry textu, žádné zpoždění klepnutí */
button,a,label,summary,input,textarea,.tap,[role="button"],[role="tab"],[role="switch"]{ touch-action:manipulation; }
button,summary,label,.tap,.chip,.seg,.gcard,.stepper,.grip,.tag,.pill{
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
}
.grip{ touch-action:none; }                   /* na dotyku se táhne jen za úchyt */

/* odezva na dotyk – pointerdown přidá .pressed, :active je záloha */
.tap{ transition:transform .18s cubic-bezier(.32,.72,0,1), opacity .18s, background-color .18s; }
.tap:active,.tap.pressed{ transform:scale(.96); opacity:.78; transition-duration:.06s; }
@media (hover:hover) and (pointer:fine){
  .btn:hover{ filter:brightness(.97); }
  .btn.primary:hover{ background:var(--accent-press); filter:none; }
  .lcard:hover,.gcard:hover,.prow:hover{ box-shadow:var(--shadow), 0 0 0 1px var(--sep-strong); }
  .icon-btn:hover,.chip:hover,.seg button:hover,.grip:hover{ background:var(--fill); }
  .aname:hover,.pinfo:hover .pname{ color:var(--accent-text); }
}

/* ============ Hlavička ============ */
.hdr{
  position:sticky; top:0; z-index:30;
  padding-top:env(safe-area-inset-top);
  background:var(--hdr-bg);
  -webkit-backdrop-filter:saturate(180%) blur(22px); backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid var(--sep);
}
.hdr-in{ max-width:1120px; margin:0 auto; padding:8px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left)); }
.hdr-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; }
.logo{ width:30px; height:30px; border-radius:9px; background:var(--accent); display:grid; place-items:center; flex:none; box-shadow:inset 0 -2px 4px rgba(0,0,0,.12); }
h1{ font-size:17px; letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.seg,.mini-seg{ position:relative; display:grid; background:var(--fill); border-radius:10px; padding:2px; }
.seg{ grid-template-columns:repeat(3,1fr); }
.mini-seg{ grid-template-columns:repeat(2,1fr); flex:none; }
.seg-i{
  position:absolute; top:2px; bottom:2px; left:2px; border-radius:8px; background:var(--card);
  box-shadow:0 1px 3px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.05);
  transition:transform .42s cubic-bezier(.32,.72,0,1); pointer-events:none;
}
.seg .seg-i{ width:calc((100% - 4px)/3); transform:translateX(calc(var(--i,0) * 100%)); }
.mini-seg .seg-i{ width:calc((100% - 4px)/2); transform:translateX(calc(var(--i,0) * 100%)); }
.seg button,.mini-seg button{ position:relative; z-index:1; min-height:34px; padding:0 6px; border-radius:8px; white-space:nowrap; font-size:13px; font-weight:600; letter-spacing:-.01em; text-align:center; color:var(--text2); transition:color .2s; }
.seg button[aria-selected="true"],.mini-seg button[aria-pressed="true"]{ color:var(--text); }
.mini-seg button{ min-height:30px; padding:0 12px; font-size:13px; }

/* ============ Rozvržení ============ */
.wrap{ max-width:1120px; margin:0 auto; padding:14px max(16px,env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
.card{ background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; }
.sub{ color:var(--text2); font-size:14px; }
#v-knihovna,#v-plan{ margin-top:14px; }
.stack{ display:flex; flex-direction:column; gap:12px; }
h2.sec{ font-size:22px; letter-spacing:-.028em; margin:22px 2px 10px; }

/* karty skupin */
.groups{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.gcard{ position:relative; text-align:left; background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:12px 14px 13px; border:2px solid transparent; display:flex; flex-direction:column; gap:2px; min-width:0; }
.gcard .gday{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); }
.gcard .gtime{ font-size:19px; font-weight:700; letter-spacing:-.03em; }
.gcard .gmeta{ font-size:13.5px; color:var(--text2); line-height:1.3; }
.gcard[aria-checked="true"]{ border-color:var(--accent); background:linear-gradient(var(--accent-bg),var(--accent-bg)), var(--card); }
.gcard[aria-checked="true"] .gday{ color:var(--accent-text); }
.gcard .gcheck{ position:absolute; top:10px; right:10px; width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; transform:scale(0); transition:transform .4s cubic-bezier(.34,1.56,.64,1); }
.gcard[aria-checked="true"] .gcheck{ transform:scale(1); }

.next{ margin-top:10px; background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:12px 14px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.next .ni{ width:36px; height:36px; border-radius:10px; background:var(--accent-bg); color:var(--accent-text); display:grid; place-items:center; flex:none; }
.next .nt{ flex:1 1 180px; min-width:0; }
.next .nl{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); }
.next .nv{ font-size:16px; font-weight:600; letter-spacing:-.015em; }
.next .nw{ font-size:13.5px; color:var(--text2); }

/* ============ Tlačítka, chipy, pilulky ============ */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 16px; border-radius:12px; background:var(--fill); font-weight:600; font-size:15px; letter-spacing:-.012em; white-space:nowrap; }
.btn.primary{ background:var(--accent); color:var(--on-accent); }
.btn.sm{ min-height:34px; padding:0 12px; font-size:14px; border-radius:10px; }
.btn.big{ min-height:50px; font-size:17px; border-radius:14px; width:100%; }
.btn.tint{ background:var(--accent-bg); color:var(--accent-text); }
.btn[disabled]{ opacity:.4; pointer-events:none; }
.icon-btn{ position:relative; width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:var(--text2); flex:none; }
.icon-btn::after{ content:""; position:absolute; inset:-4px; }
.icon-btn.add{ background:var(--accent-bg); color:var(--accent-text); }
.chips{ display:flex; gap:8px; overflow-x:auto; overscroll-behavior:contain; scrollbar-width:none; margin:0 calc(-1 * max(16px,env(safe-area-inset-right))) 0 calc(-1 * max(16px,env(safe-area-inset-left))); padding:2px max(16px,env(safe-area-inset-right)) 2px max(16px,env(safe-area-inset-left)); -webkit-overflow-scrolling:touch; }
.chips::-webkit-scrollbar{ display:none; }
.card .chips{ margin:0 -16px; padding:2px 16px; }
.chip{ flex:none; min-height:34px; padding:0 14px; border-radius:999px; background:var(--card); box-shadow:var(--shadow); font-size:14px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; }
.card .chip{ background:var(--fill); box-shadow:none; }
.chip[aria-pressed="true"]{ background:var(--accent); color:var(--on-accent); box-shadow:none; }
.pill{ display:inline-flex; align-items:center; gap:6px; min-height:30px; padding:0 12px; border-radius:999px; font-size:14px; font-weight:700; letter-spacing:-.01em; background:var(--info-bg); color:var(--info); }
.pill.ok{ background:var(--ok-bg); color:var(--ok); } .pill.warn{ background:var(--warn-bg); color:var(--warn); }
.tag{ display:inline-flex; align-items:center; min-height:22px; padding:0 8px; border-radius:7px; background:var(--fill); color:var(--text2); font-size:12px; font-weight:600; letter-spacing:-.005em; white-space:nowrap; }
.tag.t-warm{ background:var(--warm-bg); color:var(--warm); } .tag.t-drill{ background:var(--drill-bg); color:var(--drill); } .tag.t-game{ background:var(--game-bg); color:var(--game); }
.tag.grp{ background:transparent; padding:0; color:var(--text2); }
.tags{ display:flex; flex-wrap:wrap; gap:5px; min-width:0; }
.switch-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:6px 0 2px; font-size:14.5px; }
.switch{ position:relative; width:51px; height:31px; flex:none; }
.switch input{ position:absolute; inset:0; width:100%; height:100%; margin:0; opacity:0; cursor:pointer; z-index:2; }
.switch i{ position:absolute; inset:0; border-radius:999px; background:var(--sep-strong); transition:background .25s; }
.switch i::after{ content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:50%; background:#fff; box-shadow:0 2px 5px rgba(0,0,0,.3); transition:transform .38s cubic-bezier(.34,1.4,.64,1); }
.switch input:checked + i{ background:var(--ok); }
.switch input:checked + i::after{ transform:translateX(20px); }
.switch input:focus-visible + i{ outline:2px solid var(--accent-text); outline-offset:2px; }

/* ============ Trénink ============ */
.train-grid{ display:flex; flex-direction:column; gap:12px; margin-top:14px; }
.col-a,.col-b{ display:contents; }
.col-a>.tl{ order:1; } .col-b>.picker{ order:2; } .col-b>.sumwrap{ order:3; } .col-a>.notes{ order:4; } .col-a>.savebox{ order:5; } .col-a>.savedbox{ order:6; }
.tl-top{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
.tl-actions{ display:flex; gap:8px; }
.fixed{ display:flex; align-items:center; gap:12px; padding:10px 14px; margin-bottom:12px; background:var(--card); border-radius:var(--r-sm); box-shadow:var(--shadow); font-weight:600; letter-spacing:-.012em; }
.fixed .ft{ font-variant-numeric:tabular-nums; color:var(--text2); font-size:14px; margin-left:auto; font-weight:500; }
.fixed .dot{ width:10px; height:10px; border-radius:50%; background:var(--text2); opacity:.5; }
.block{ background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:14px; margin-bottom:12px; border:2px solid transparent; transition:border-color .15s, background-color .15s; }
.block.drop-on{ border-color:var(--accent); background:linear-gradient(var(--accent-bg),var(--accent-bg)), var(--card); }
.bh{ display:flex; align-items:center; gap:10px; }
.bh .dot{ width:12px; height:12px; border-radius:50%; flex:none; }
.dot.warm{ background:var(--warm); } .dot.drill{ background:var(--drill); } .dot.game{ background:var(--game); }
.bt{ flex:1; min-width:0; }
.bt h3{ font-size:18px; letter-spacing:-.026em; }
.bsub{ font-size:13.5px; color:var(--text2); font-variant-numeric:tabular-nums; }
.fillrow{ display:flex; align-items:center; gap:10px; margin:10px 0 4px; }
.fill{ flex:1; height:8px; border-radius:99px; background:var(--fill); overflow:hidden; }
.fill>i{ display:block; height:100%; width:var(--p,0%); border-radius:99px; background:var(--info); transition:width .5s cubic-bezier(.32,.72,0,1), background-color .3s; }
.fill.ok>i{ background:var(--ok); } .fill.over>i{ background:var(--warn); }
.fill-t{ font-size:13px; font-weight:700; font-variant-numeric:tabular-nums; min-width:68px; text-align:right; }
.statusline{ display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:28px; margin-bottom:6px; font-size:13.5px; color:var(--text2); }
.statusline .okt{ color:var(--ok); font-weight:600; display:inline-flex; align-items:center; gap:5px; }
.list{ position:relative; display:flex; flex-direction:column; gap:6px; }
.empty{ border:1.5px dashed var(--sep-strong); border-radius:var(--r-sm); padding:16px 12px; text-align:center; color:var(--text2); font-size:14px; }
.arow{ display:grid; grid-template-columns:36px 1fr 36px; grid-template-areas:"grip name rm" ". meta meta"; align-items:center; column-gap:4px; row-gap:2px; padding:6px 8px 8px 4px; background:var(--card2); border-radius:var(--r-sm); }
.arow .grip{ grid-area:grip; } .arow .aname{ grid-area:name; } .arow .rm{ grid-area:rm; } .arow .ameta{ grid-area:meta; }
.arow.landed{ animation:landed .7s cubic-bezier(.32,.72,0,1); }
@keyframes landed{ 0%{ background:var(--accent-bg); box-shadow:0 0 0 2px var(--accent); } 100%{ box-shadow:0 0 0 0 transparent; } }
.grip{ width:36px; height:40px; display:grid; place-items:center; border-radius:10px; color:var(--text2); cursor:grab; position:relative; }
.grip::after{ content:""; position:absolute; inset:-4px -2px; }
.grip.pressed{ background:var(--fill); color:var(--text); }
.aname{ font-weight:600; font-size:15.5px; letter-spacing:-.015em; line-height:1.25; padding:6px 4px; min-width:0; }
.ameta{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:0 0 0 6px; }
.stepper{ display:inline-flex; align-items:center; background:var(--card); border-radius:10px; box-shadow:0 0 0 .5px var(--sep-strong); flex:none; }
.stepper button{ width:38px; height:34px; display:grid; place-items:center; border-radius:10px; font-size:20px; line-height:1; color:var(--text); }
.stepper output{ min-width:50px; text-align:center; font-weight:700; font-size:14.5px; font-variant-numeric:tabular-nums; }
.is-src{ opacity:.35; }
.drop-line{ position:absolute; left:0; right:0; top:0; height:3px; border-radius:2px; background:var(--accent); pointer-events:none; z-index:2; transition:transform .14s cubic-bezier(.32,.72,0,1); }
.ghost{ position:fixed !important; left:0; top:0; z-index:90; margin:0 !important; pointer-events:none; box-shadow:var(--shadow-lift); border-radius:14px; background:var(--card) !important; will-change:transform; }
.ghost .stepper,.ghost .rm,.ghost .icon-btn.add{ opacity:.0; }
body.is-dragging{ -webkit-user-select:none; user-select:none; cursor:grabbing; }
body.is-dragging *{ cursor:grabbing !important; }

.picker .ph{ margin-bottom:10px; }
.picker h3{ font-size:18px; }
.plist{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.prow{ display:grid; grid-template-columns:36px 1fr 40px; align-items:center; column-gap:4px; padding:5px 6px 5px 4px; background:var(--card2); border-radius:var(--r-sm); }
.pinfo{ text-align:left; padding:4px; min-width:0; display:flex; flex-direction:column; gap:4px; }
.pname{ font-weight:600; font-size:15px; letter-spacing:-.015em; line-height:1.25; }
.pmeta{ display:flex; align-items:center; flex-wrap:wrap; gap:5px; }
.sumcard h3{ font-size:17px; margin-bottom:8px; }
.sumcard + .sumcard{ margin-top:12px; }
.gearlist{ display:flex; flex-direction:column; gap:6px; }
.gear{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; font-size:15px; padding:4px 0; border-bottom:.5px solid var(--sep); }
.gear:last-child{ border-bottom:0; }
.gear span{ color:var(--text2); font-size:13.5px; text-align:right; }
.hint{ font-size:14.5px; line-height:1.45; }
.hint b{ font-weight:650; }
.note-area,.name-in{ width:100%; border:0; border-radius:12px; background:var(--card2); padding:12px 14px; font-size:16px; line-height:1.4; letter-spacing:-.01em; resize:vertical; min-height:96px; }
.name-in{ min-height:44px; resize:none; }
.note-area::placeholder,.name-in::placeholder{ color:var(--text2); opacity:.8; }
.rowf{ display:flex; gap:8px; }
.rowf .name-in{ flex:1; min-width:0; }
.saved{ display:flex; flex-direction:column; gap:6px; margin-top:10px; }
.srow{ display:flex; align-items:center; gap:8px; padding:8px 8px 8px 12px; background:var(--card2); border-radius:var(--r-sm); }
.srow .st{ flex:1; min-width:0; }
.srow .sn{ font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.srow .sm{ font-size:13px; color:var(--text2); }
.card h3.ct{ font-size:17px; margin-bottom:8px; }

/* ============ Knihovna ============ */
.lib-top{ display:flex; flex-direction:column; gap:10px; }
.lib-meta{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
.lib-meta .switch-row{ padding:0; gap:10px; }
.lgrid{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:12px; }
.lcard{ display:flex; flex-direction:column; gap:8px; text-align:left; background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:14px; min-width:0; }
.lc-top{ display:flex; align-items:center; justify-content:space-between; }
.lc-min{ font-size:13px; font-weight:700; color:var(--text2); font-variant-numeric:tabular-nums; }
.lcard h3{ font-size:18px; letter-spacing:-.026em; }
.lcard .fun{ font-size:14px; color:var(--text2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.lc-foot{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:auto; padding-top:2px; font-size:12.5px; color:var(--text2); }
.nores{ text-align:center; color:var(--text2); padding:32px 8px; }

/* ============ Plán ============ */
.plan-head h2{ font-size:24px; letter-spacing:-.03em; }
.progress{ display:flex; align-items:center; gap:12px; margin-top:12px; }
.progress .fill{ height:10px; } .progress .fill>i{ background:var(--accent); }
.progress b{ font-variant-numeric:tabular-nums; font-size:14px; white-space:nowrap; }
.phases{ display:flex; flex-direction:column; gap:12px; margin-top:14px; }
.phase{ background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; }
.phase>summary{ list-style:none; display:flex; align-items:center; gap:12px; padding:14px; cursor:pointer; }
.phase>summary::-webkit-details-marker{ display:none; }
.phase .pn{ width:34px; height:34px; border-radius:11px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font-weight:800; font-size:16px; flex:none; }
.phase .pt{ flex:1; min-width:0; } .phase .pt h3{ font-size:18px; letter-spacing:-.026em; }
.phase .pt p{ font-size:13.5px; color:var(--text2); }
.phase .chev{ color:var(--text2); transition:transform .35s cubic-bezier(.32,.72,0,1); }
.phase[open] .chev{ transform:rotate(180deg); }
.weeks{ display:grid; grid-template-columns:1fr; gap:10px; padding:0 12px 12px; }
.week{ background:var(--card2); border-radius:var(--r-sm); padding:12px; display:flex; flex-direction:column; gap:10px; }
.week.done{ background:linear-gradient(var(--ok-bg),var(--ok-bg)), var(--card2); }
.wh{ display:flex; align-items:baseline; gap:8px; }
.wh .wn{ font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent-text); flex:none; }
.wh h4{ font-size:16.5px; letter-spacing:-.022em; }
.wlist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px; }
.wlist button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; padding:6px 4px; border-radius:8px; font-size:14.5px; letter-spacing:-.01em; }
.wlist .tag{ min-width:84px; justify-content:center; }
.goal{ font-size:14px; background:var(--card); border-radius:10px; padding:9px 11px; line-height:1.4; }
.goal b{ color:var(--accent-text); font-weight:700; }
.wa{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.done-toggle{ position:relative; display:inline-flex; align-items:center; gap:9px; min-height:40px; font-weight:600; font-size:14.5px; cursor:pointer; }
.done-toggle input{ position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer; }
.done-toggle .box{ width:26px; height:26px; border-radius:50%; border:2px solid var(--sep-strong); display:grid; place-items:center; color:#fff; transition:background-color .2s, border-color .2s; }
.done-toggle .box svg{ transform:scale(0); transition:transform .4s cubic-bezier(.34,1.56,.64,1); }
.done-toggle input:checked + .box{ background:var(--ok); border-color:var(--ok); } .done-toggle input:checked + .box svg{ transform:scale(1); }
.done-toggle input:focus-visible + .box{ outline:2px solid var(--accent-text); outline-offset:2px; }
.culture{ display:grid; grid-template-columns:1fr; gap:10px; }
.ccard{ background:var(--card); border-radius:var(--r); box-shadow:var(--shadow); padding:16px; }
.ccard .cn{ width:32px; height:32px; border-radius:10px; background:var(--accent-bg); color:var(--accent-text); display:grid; place-items:center; font-weight:800; margin-bottom:10px; }
.ccard h3{ font-size:17.5px; margin-bottom:6px; }
.ccard p{ font-size:14.5px; color:var(--text2); line-height:1.45; }

/* ============ Bottom sheet ============ */
.scrim{ position:fixed; inset:0; z-index:60; background:var(--scrim); opacity:0; touch-action:none; -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px); }
.sheet{
  position:fixed; z-index:61; left:0; right:0; bottom:0; margin:0 auto; width:100%; max-width:660px;
  max-height:min(90dvh, 880px); display:flex; flex-direction:column;
  background:var(--card); border-radius:22px 22px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.25);
  will-change:transform; outline:0;
}
.sheet::after{ content:""; position:absolute; top:100%; left:0; right:0; height:240px; background:var(--card); }  /* nikdy neodkryje mezeru při pružení */
.sheet-head{ flex:none; padding:8px 8px 4px 20px; touch-action:none; cursor:grab; -webkit-user-select:none; user-select:none; }
.grabber{ width:38px; height:5px; border-radius:3px; background:var(--sep-strong); margin:0 auto 8px; }
.sheet-bar{ display:flex; align-items:flex-start; gap:10px; }
.sheet-bar .tt{ flex:1; min-width:0; padding-top:2px; }
.sheet-bar h2{ font-size:24px; letter-spacing:-.032em; }
.sheet-bar .sub{ margin-top:2px; }
.sheet-body{ flex:1; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:4px 20px 12px; }
.sheet-body h3{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); margin:20px 0 8px; font-weight:700; }
.sheet-body ol,.sheet-body ul{ margin:0; padding:0 0 0 22px; display:flex; flex-direction:column; gap:7px; }
.sheet-body li{ padding-left:2px; line-height:1.45; }
.sheet-body ol li::marker{ font-weight:700; color:var(--accent-text); }
.meta{ display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 14px; }
.fun{ background:var(--accent-bg); border-radius:var(--r-sm); padding:12px 14px; font-size:15px; line-height:1.45; }
.fun b{ color:var(--accent-text); }
.duo{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:20px; }
.mini{ border-radius:var(--r-sm); padding:12px 14px; font-size:14.5px; line-height:1.45; }
.mini h4{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:4px; }
.mini.ok{ background:var(--ok-bg); } .mini.ok h4{ color:var(--ok); }
.mini.hard{ background:var(--warn-bg); } .mini.hard h4{ color:var(--warn); }
.gchips{ display:flex; flex-wrap:wrap; gap:6px; }
.gchips .tag{ min-height:28px; font-size:13.5px; padding:0 10px; }
.sheet-foot{ flex:none; padding:10px 20px calc(12px + env(safe-area-inset-bottom)); border-top:.5px solid var(--sep); background:var(--card); }

/* ============ Toast ============ */
.toast{
  position:fixed; z-index:95; left:50%; bottom:calc(16px + env(safe-area-inset-bottom)); transform:translate3d(-50%,0,0);
  width:calc(100% - 32px); max-width:480px; display:flex; align-items:center; gap:12px; padding:8px 8px 8px 16px; min-height:48px;
  border-radius:16px; background:rgba(44,44,46,.96); color:#fff; box-shadow:0 10px 30px rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); font-size:15px; font-weight:500; letter-spacing:-.01em;
}
.toast span{ flex:1; min-width:0; }
.toast button{ min-height:36px; padding:0 14px; border-radius:10px; background:rgba(255,255,255,.16); color:#ff8f94; font-weight:700; }
@media (prefers-color-scheme: dark){ .toast{ background:rgba(58,58,60,.97); } }
@media (prefers-reduced-transparency: reduce){ .toast{ -webkit-backdrop-filter:none; backdrop-filter:none; background:#2c2c2e; } .scrim{ -webkit-backdrop-filter:none; backdrop-filter:none; } }

/* ============ Široké obrazovky ============ */
@media (min-width:700px){
  .lgrid{ grid-template-columns:repeat(2,1fr); }
  .weeks{ grid-template-columns:repeat(2,1fr); }
  .culture{ grid-template-columns:repeat(2,1fr); }
  .duo{ grid-template-columns:1fr 1fr; }
}
@media (min-width:980px){
  .lgrid{ grid-template-columns:repeat(3,1fr); }
  .culture{ grid-template-columns:repeat(4,1fr); }
  .weeks{ grid-template-columns:repeat(2,1fr); }
  .train-grid{ display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr); gap:18px; align-items:start; }
  .col-a{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .col-b{ display:flex; flex-direction:column; gap:12px; min-width:0; position:sticky; top:calc(var(--hdr-h) + 14px); max-height:calc(100dvh - var(--hdr-h) - 28px); overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; padding:2px; margin:-2px; }
  .col-a>*,.col-b>*{ order:0 !important; }
  .plist{ max-height:46dvh; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; }
  .sumcard + .sumcard{ margin-top:12px; }
  .groups{ max-width:640px; }
}

/* ============ Reduced motion ============ */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; scroll-behavior:auto !important; }
}
</style>
</head>
<body>
<header class="hdr" id="hdr">
  <div class="hdr-in">
    <div class="hdr-row">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9.5" fill="#fff"/><g fill="#c8141b"><circle cx="11" cy="5.2" r="1.15"/><circle cx="16" cy="8" r="1.15"/><circle cx="16" cy="14" r="1.15"/><circle cx="11" cy="16.8" r="1.15"/><circle cx="6" cy="14" r="1.15"/><circle cx="6" cy="8" r="1.15"/><circle cx="11" cy="11" r="1.15"/></g></svg>
        </span>
        <h1>Olymp Florbal Tréninky</h1>
      </div>
      <div class="mini-seg" id="miniSeg" role="group" aria-label="Skupina" style="--i:0">
        <span class="seg-i" aria-hidden="true"></span>
        <button type="button" class="tap" data-act="group" data-g="ut" aria-pressed="true">Út</button>
        <button type="button" class="tap" data-act="group" data-g="pa" aria-pressed="false">Pá</button>
      </div>
    </div>
    <div class="seg" id="tabs" role="tablist" aria-label="Sekce" style="--i:0">
      <span class="seg-i" aria-hidden="true"></span>
      <button type="button" class="tap" role="tab" id="tab-trenink" aria-controls="v-trenink" data-act="tab" data-t="trenink" aria-selected="true">Trénink</button>
      <button type="button" class="tap" role="tab" id="tab-knihovna" aria-controls="v-knihovna" data-act="tab" data-t="knihovna" aria-selected="false">Knihovna</button>
      <button type="button" class="tap" role="tab" id="tab-plan" aria-controls="v-plan" data-act="tab" data-t="plan" aria-selected="false">Plán 20 týdnů</button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <section aria-label="Skupina">
    <div class="groups" id="groups" role="radiogroup" aria-label="Tréninková skupina"></div>
    <div class="next" id="next"></div>
  </section>

  <section id="v-trenink" role="tabpanel" aria-labelledby="tab-trenink">
    <div class="train-grid">
      <div class="col-a">
        <div class="tl" id="tl"></div>
        <section class="card notes">
          <h3 class="ct"><label for="notes">Poznámky k tréninku</label></h3>
          <textarea id="notes" class="note-area" rows="4" placeholder="Co se povedlo, co příště změnit, kdo chyběl…"></textarea>
        </section>
        <section class="card savebox">
          <h3 class="ct"><label for="saveName">Uložit trénink</label></h3>
          <div class="rowf">
            <input id="saveName" class="name-in" type="text" maxlength="60" autocomplete="off" placeholder="Název, např. Střelba – 3. týden">
            <button type="button" class="btn primary tap" data-act="save">Uložit</button>
          </div>
        </section>
        <section class="card savedbox">
          <h3 class="ct">Uložené tréninky</h3>
          <div class="saved" id="saved"></div>
        </section>
      </div>
      <div class="col-b">
        <section class="card picker" id="picker"></section>
        <div class="sumwrap" id="sum"></div>
      </div>
    </div>
  </section>

  <section id="v-knihovna" role="tabpanel" aria-labelledby="tab-knihovna" hidden>
    <div class="lib-top" id="libTop"></div>
    <div class="lgrid" id="lgrid"></div>
  </section>

  <section id="v-plan" role="tabpanel" aria-labelledby="tab-plan" hidden></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
  <div class="sheet-head" id="sheetHead">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-bar">
      <div class="tt"><h2 id="sheetTitle"></h2><p class="sub" id="sheetSub"></p></div>
      <button type="button" class="icon-btn tap" data-act="sheet-close" aria-label="Zavřít">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>
      </button>
    </div>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
  <div class="sheet-foot"><button type="button" class="btn primary big tap" id="sheetAdd" data-act="sheet-add">Přidat do tréninku</button></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>
/* =====================================================================
   DATA – knihovna aktivit, plán, týmová kultura
   ===================================================================== */
const SKILLS = {
  vedeni:'Vedení míčku', prihravka:'Přihrávka', zpracovani:'Zpracování', strelba:'Střelba',
  souboj:'1 na 1', precisleni:'Přečíslení', pohyb:'Pohyb bez míčku', cit:'Cit pro míček',
  tym:'Týmovost', obratnost:'Obratnost', cista:'Čistá hra'
};
const GEAR = {
  micky:{ n:'Míčky', stock:'máš 20 ks' },
  rozl:{ n:'Rozlišováky', stock:'máš 10 ks' },
  branky:{ n:'Branky', stock:'podle dostupnosti' },
  mantinely:{ n:'Mantinely', stock:'jen když jsou' },
  piskalka:{ n:'Píšťalka', stock:'' }
};
const TYPES = {
  warm:{ n:'Rozcvička', pl:'Rozcvičky', block:'Rozcvička' },
  drill:{ n:'Cvičení', pl:'Cvičení', block:'Cvičení' },
  game:{ n:'Hra', pl:'Herní situace', block:'Zápas' }
};
const GRP_LABEL = { ut:'Út · 6.–9. třída', pa:'Pá · 1.–5. třída', both:'Obě skupiny' };

/* gear: 'x?' = volitelné.  grp: ut | pa | both */
const ACTS = [
/* ---------------------------- ROZCVIČKY ---------------------------- */
{ id:'w-honicka', type:'warm', name:'Honička o ocásky', min:7, skills:['obratnost','pohyb'], grp:'both', gear:['rozl'],
  prep:'Vymez hřiště zhruba poloviny velikosti haly. Půlka dětí (nejvýš 10) si zastrčí rozlišovák za pas jako ocásek, druhá půlka honí. Všichni mají hůlku v jedné ruce, čepelí dolů.',
  steps:[
    'Lovci chytají ocásky. Kdo o ocásek přijde, odběhne k čáře, udělá 5 dřepů a vrací se do hry.',
    'Po 90 sekundách se role vymění – ocásky si berou ti, kdo dosud honili.',
    'Přidej pravidlo: kdo získá 3 ocásky, vyhrává kolo a vybere, jak se bude příští kolo honit (poskoky, vzad, po jedné noze).',
    'Na závěr krátké protažení a pochvala pro děti, které nejčistěji uhýbaly.'
  ],
  tips:['Hůlka zůstává dole pod pasem – kdo ji zvedne nad pás, ztrácí ocásek. Učí to čistou hru od první minuty.','Chytá se jen za ocásek, nikdy za tělo ani dres. Hlídej srážky u okrajů.'],
  easier:'Menší hřiště a méně lovců (stačí třetina dětí).',
  harder:'Každý vede míček: kdo ztratí míček, ztrácí i ocásek.',
  fun:'Je to klasická honička – zahřeje i ty nejstydlivější a nikdo u toho nestojí.' },

{ id:'w-semafor', type:'warm', name:'Semafor', min:6, skills:['vedeni','cit','pohyb'], grp:'both', gear:['micky'],
  prep:'Každý má míček (20 ks stačí pro všechny, jinak ve dvojicích) a volný prostor. Trenér stojí tak, aby ho všichni viděli.',
  steps:[
    'Zelená: děti vedou míček volně po celém prostoru a vyhýbají se ostatním.',
    'Žlutá: zpomalí, míček drží těsně u čepele a mají hlavu nahoře.',
    'Červená: zastaví míček hůlkou a zůstanou stát jako sochy. Poslední zastavený splní mini-úkol (5× přetažení míčku).',
    'Modrá: otočka a vedení na opačnou stranu. Barvy střídej nepravidelně.'
  ],
  tips:['Hlavu nahoře! Kdo se dívá jen na míček, přehlédne barvu i spolužáka.','Střídej tempo a barvy nepředvídatelně, ať musí děti opravdu poslouchat.'],
  easier:'Jen zelená a červená, míček se zatím pomalu kutálí.',
  harder:'Zelená = vedení jen bekhendem, žlutá = vzad, modrá = přetahování míčku z forhendu na bekhend.',
  fun:'Děti znají semafor z cesty do školy, takže pravidla chápou za pět vteřin – a soutěží, kdo zastaví poslední.' },

{ id:'w-vlacek', type:'warm', name:'Vláček', min:6, skills:['vedeni','tym','obratnost'], grp:'pa', gear:['micky','rozl'],
  prep:'Děti se rozdělí do vláčků po 4–5. Každé dítě má míček. Na zem polož několik rozlišováků jako „tunely“ a „nádraží“.',
  steps:[
    'První dítě je lokomotiva a vede vláček po hřišti. Ostatní za ní kopírují směr i tempo a vedou svůj míček.',
    'Po 30 sekundách (nebo na pískání) se lokomotiva zařadí na konec a vedení přebírá další.',
    'Vláčky projíždějí „tunelem“ – mezi dvěma rozlišováky na zemi – a vyhýbají se jiným vláčkům.',
    'Na „nádraží“ všichni zastaví míček, otočí se a vláček vyjede opačným směrem. Poslední je nová lokomotiva.'
  ],
  tips:['Lokomotiva jede tak, aby ji všichni stihli – ne rychleji než nejpomalejší vagon.','Pochval lokomotivy, které se ohlížejí a čekají na ostatní. Učí se vést i následovat.'],
  easier:'Bez míčků, jen chůze a běh s hůlkou v ruce.',
  harder:'Lokomotiva mění tempo a směr a zadává úkoly (přetahování, vedení vzad).',
  fun:'Každý se dostane k roli lokomotivy a mladší děti milují, že jsou součástí „vlaku“.' },

{ id:'w-poklad', type:'warm', name:'Pirátský poklad', min:8, skills:['vedeni','tym','obratnost'], grp:'pa', gear:['micky','rozl'],
  prep:'Do středu hřiště nasyp všechny míčky (poklad). Po stranách vyznač každé posádce (3–5 dětí) základnu – kruh nebo čtverec z rozlišováků.',
  steps:[
    'Na povel vyrazí piráti pro poklad. Každý smí odnést vždy jen jeden míček a vede ho hůlkou do základny své posádky. Míčky se nikdy nenosí v ruce.',
    'Když je střed prázdný, smí se krást z cizích základen – jen hůlkou, bez kontaktu a bez bránění tělem.',
    'Po dvou minutách trenér zapíská, posádky spočítají poklad a vítězná posádka vybere název pro příští kolo.',
    'Posádky se promíchají a hra se zopakuje s novými spoluhráči.'
  ],
  tips:['Hůlka zůstává pod pasem a krade se jen z míčku, ne z dítěte.','Vyzvi posádky, ať si rozdělí role: kdo hlídá základnu, kdo vyráží.'],
  easier:'Žádné krádeže – děti jen sbírají poklad do základny.',
  harder:'Základny jsou dál od středu, nebo se míček odevzdává až po přihrávce spoluhráči.',
  fun:'Pirátský příběh a poklad – děti hrají naplno a ani si neuvědomí, že trénují vedení míčku.' },

{ id:'w-dyn', type:'warm', name:'Dynamická rozcvička ve dvojicích', min:8, skills:['obratnost','prihravka','tym'], grp:'ut', gear:['micky'],
  prep:'Dvojice, na dvojici jeden míček (7 míčků pro 13 dětí). Vymez dráhu 15–20 m a dvojice rozestav vedle sebe s odstupem.',
  steps:[
    'Klus ve dvojicích vedle sebe po dráze tam a zpět. Mezi dvojicí jde míček forhendem a bekhendem po zemi.',
    'Každých 10 m změna pohybu: výpady, skipy, boční přísuny, koleno k hrudi. Míček si děti přihrávají v pauzách.',
    'Zpátky stejně, ale přidej běh pozadu a rotace trupu s hůlkou za zády.',

{ id:'w-draha', type:'warm', name:'Koordinační dráha z rozlišováků', min:8, skills:['obratnost','pohyb','cit'], grp:'both', gear:['rozl','micky?'],

{ id:'d-labyrint', type:'drill', name:'Labyrint', min:8, skills:['vedeni','pohyb'], grp:'pa', gear:['micky','rozl'],

{ id:'d-metronom', type:'drill', name:'Metronom (přetahování míčku)', min:8, skills:['vedeni','cit'], grp:'ut', gear:['micky'],

{ id:'d-branky', type:'drill', name:'Přihrávkové brány', min:8, skills:['prihravka','zpracovani'], grp:'both', gear:['micky','rozl'],

{ id:'d-trojuhelnik', type:'drill', name:'Přihrávkový trojúhelník', min:8, skills:['prihravka','pohyb'], grp:'ut', gear:['micky','rozl'],

{ id:'d-terce', type:'drill', name:'Střelba na terče', min:8, skills:['strelba'], grp:'pa', gear:['micky','rozl','branky?'],

{ id:'d-poklad', type:'drill', name:'Hlídač pokladu (1 na 1)', min:8, skills:['souboj','vedeni'], grp:'pa', gear:['micky','rozl'],

{ id:'d-2na1', type:'drill', name:'2 na 1', min:9, skills:['precisleni','prihravka','pohyb'], grp:'both', gear:['micky','branky?','rozl'],

/* ---------- spring (Apple-styl: response + damping ratio, s přenosem rychlosti) ---------- */
function spring({ from, to, velocity = 0, response = .4, damping = .85, eps = .25, onUpdate, onDone }) {
  const w = 2 * Math.PI / response, k = w * w, c = 2 * damping * w;
  let x = from, v = velocity, last = performance.now(), raf = 0, stopped = false;
  const h = { stop(){ stopped = true; cancelAnimationFrame(raf); }, get x(){ return x; }, get v(){ return v; } };
  if (RM.matches) { x = to; v = 0; onUpdate && onUpdate(to, 0); onDone && onDone(); return h; }
  const step = now => {
    if (stopped) return;
    const dt = Math.min((now - last) / 1000, 1 / 30); last = now;
    const n = Math.max(1, Math.ceil(dt / (1 / 240))), s = dt / n;
    for (let i = 0; i < n; i++) { v += (-k * (x - to) - c * v) * s; x += v * s; }
    if (Math.abs(v) < eps * 20 && Math.abs(x - to) < eps) { x = to; v = 0; onUpdate && onUpdate(x, 0); onDone && onDone(); return; }
    onUpdate && onUpdate(x, v);
    raf = requestAnimationFrame(step);
  };
  raf = requestAnimationFrame(step);
  return h;
}

function sanitize(raw) {
  const s = state;
  if (!raw || typeof raw !== 'object') return;
  if (GROUPS[raw.group]) s.group = raw.group;
  if (['trenink','knihovna','plan'].includes(raw.tab)) s.tab = raw.tab;
  for (const g of ['ut','pa']) {
    const p = raw.plans && raw.plans[g];
    if (p) {
      const np = blankPlan();
      for (const b of BLOCKS) np[b] = (Array.isArray(p[b]) ? p[b] : []).filter(i => i && ACT[i.id]).map(i => ({ uid:uid(), id:i.id, min:Math.max(1, Math.min(60, i.min | 0 || ACT[i.id].min)) }));
      np.gameLen = p.gameLen === 25 ? 25 : 20;
      np.notes = typeof p.notes === 'string' ? p.notes.slice(0, 4000) : '';
      s.plans[g] = np;
    }
    const d = raw.done && raw.done[g];
    if (Array.isArray(d)) s.done[g] = Array.from({ length:20 }, (_, i) => !!d[i]);
    if (raw.phaseOpen && raw.phaseOpen[g] && typeof raw.phaseOpen[g] === 'object') s.phaseOpen[g] = raw.phaseOpen[g];
  }
  if (Array.isArray(raw.saved)) s.saved = raw.saved.filter(x => x && GROUPS[x.group] && x.plan).slice(0, 100).map(x => {
    const np = blankPlan();
    for (const b of BLOCKS) np[b] = (x.plan[b] || []).filter(i => i && ACT[i.id]).map(i => ({ uid:uid(), id:i.id, min:i.min | 0 || ACT[i.id].min }));
    np.gameLen = x.plan.gameLen === 25 ? 25 : 20; np.notes = typeof x.plan.notes === 'string' ? x.plan.notes : '';
    return { id:String(x.id || uid()), name:String(x.name || 'Trénink').slice(0, 60), group:x.group, date:String(x.date || ''), plan:np };
  });
  s.showOther = !!raw.showOther;
  if (['all','warm','drill','game'].includes(raw.libType)) s.libType = raw.libType;
  if (['all','warm','drill','game'].includes(raw.pickType)) s.pickType = raw.pickType;
  if (raw.libSkill === 'all' || SKILLS[raw.libSkill]) s.libSkill = raw.libSkill;
}

/* ---------- datum: příští trénink ---------- */
function nextSession(g, now = new Date()) {
  const [sh, sm] = g.start.split(':').map(Number), [eh, em] = g.end.split(':').map(Number);
  let add = (g.dow - now.getDay() + 7) % 7;
  const at = (d, h, m) => new Date(now.getFullYear(), now.getMonth(), now.getDate() + d, h, m);
  if (add === 0 && now >= at(0, eh, em)) add = 7;
  const start = at(add, sh, sm);
  const live = add === 0 && now >= start;
  let rel;
  if (live) rel = 'právě probíhá';
  else if (add === 0) rel = `dnes v ${g.start}`;
  else if (add === 1) rel = 'zítra';
  else rel = `za ${add} ${add < 5 ? 'dny' : 'dní'}`;
  return { start, live, rel, label:`${DAYS[start.getDay()]} ${start.getDate()}. ${start.getMonth() + 1}.` };
}
const currentWeek = g => { const i = state.done[g].findIndex(d => !d); return i < 0 ? -1 : i; };
const phaseOf = w => Math.floor(w / 4);

/* ---------- výpočty tréninku ---------- */
const targetOf = (p, b) => b === 'game' ? p.gameLen : 15;
const sumOf = items => items.reduce((s, i) => s + i.min, 0);
function timeline(p, g) {
  const [h, m] = g.start.split(':').map(Number);
  let t = h * 60 + m; const t0 = t;
  const out = { start:t, items:[], blocks:{} };
  out.att = { from:t, to:t + 5 }; t += 5;
  for (const b of BLOCKS) {
    const target = targetOf(p, b), sum = sumOf(p[b]), dur = p[b].length ? sum : target;
    out.blocks[b] = { from:t, to:t + dur, target, sum, dur };
    t += dur;
  }
  out.rev = { from:t, to:t + 5 }; t += 5;
  out.end = t; out.total = t - t0;
  return out;
}
function equalizeItems(items, target) {
  if (!items.length) return;
  let diff = target - sumOf(items), guard = 400;
  while (diff !== 0 && guard--) {
    if (diff > 0) { const x = items.reduce((a, b) => b.min < a.min ? b : a); x.min++; diff--; }
    else { const c = items.filter(i => i.min > 1); if (!c.length) break; const x = c.reduce((a, b) => b.min > a.min ? b : a); x.min--; diff++; }
  }
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pickFor(type, target) {
  const g = state.group, used = new Set(BLOCKS.flatMap(b => plan()[b].map(i => i.id)));
  const pool = shuffle(ACTS.filter(a => a.type === type && (a.grp === 'both' || a.grp === g)));
  pool.sort((a, b) => (used.has(a.id) ? 1 : 0) - (used.has(b.id) ? 1 : 0));
  const out = []; let sum = 0;
  for (const a of pool) {
    if (out.length >= 2 || sum >= target - (type === 'game' ? 5 : 2)) break;
    if (out.length && type === 'drill' && ACT[out[0].id].skills[0] === a.skills[0]) continue;
    out.push({ uid:uid(), id:a.id, min:a.min }); sum += a.min;
  }
  equalizeItems(out, target);
  return out;
}

/* ---------- toast ---------- */
const toastEl = $('#toast'); let toastTimer = 0, toastUndo = null, toastSp = null;
function toast(msg, undo) {
  clearTimeout(toastTimer); toastUndo = undo || null;
  toastEl.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" class="tap" data-act="toast-undo">Zpět</button>' : ''}`;
  toastEl.hidden = false;
  if (toastSp) toastSp.stop();
  toastEl.style.opacity = '0';
  toastSp = spring({ from:26, to:0, response:.42, damping:.8, onUpdate:y => { toastEl.style.transform = `translate3d(-50%,${y}px,0)`; toastEl.style.opacity = String(Math.min(1, 1 - y / 26 + .15)); } });
  toastTimer = setTimeout(hideToast, undo ? 6500 : 3200);
}
function hideToast() {
  clearTimeout(toastTimer); if (toastSp) toastSp.stop();
  if (toastEl.hidden) return;
  toastSp = spring({ from:0, to:30, response:.3, damping:1, onUpdate:y => { toastEl.style.transform = `translate3d(-50%,${y}px,0)`; toastEl.style.opacity = String(Math.max(0, 1 - y / 30)); }, onDone:() => { toastEl.hidden = true; } });
}

}

  g.style.width = r.width + 'px'; g.style.transformOrigin = `${D.offX}px ${D.offY}px`; g.setAttribute('aria-hidden', 'true');
  document.body.appendChild(g); D.ghost = g;
  D.src.classList.add('is-src'); document.body.classList.add('is-dragging');
  D.liftSp = spring({ from:0, to:1, response:.3, damping:.7, eps:.002, onUpdate:v => { D.lift = v; moveGhost(); } });
  moveGhost(); updateTarget();
  const auto = () => {
    if (!D || !D.started) return;
    const top = headerH() + 28, bot = innerHeight - 70; let dy = 0;
    if (D.y < top) dy = -Math.min(20, (top - D.y) / 3 + 2); else if (D.y > bot) dy = Math.min(20, (D.y - bot) / 3 + 2);
    if (dy) { window.scrollBy(0, dy); updateTarget(); }
    D.raf = requestAnimationFrame(auto);
  };
  D.raf = requestAnimationFrame(auto);
}
function moveGhost() { if (D && D.ghost) D.ghost.style.transform = `translate3d(${D.x - D.offX}px,${D.y - D.offY}px,0) scale(${1 + .035 * D.lift})`; }
function updateTarget() {
  let t = null;
  for (const list of $$('[data-list]')) {
    const box = list.closest('[data-block]'), r = box.getBoundingClientRect(), m = 10;
    if (D.x >= r.left - m && D.x <= r.right + m && D.y >= r.top - m && D.y <= r.bottom + m) {
      const rows = $$('.arow', list).filter(n => !n.classList.contains('is-src'));
      let idx = 0; for (const n of rows) { const rr = n.getBoundingClientRect(); if (D.y > rr.top + rr.height / 2) idx++; else break; }
      t = { block:list.dataset.list, index:idx, list, rows }; break;
    }
  }
  D.target = t;
  $$('.block.drop-on').forEach(b => { if (!t || b !== t.list.closest('.block')) b.classList.remove('drop-on'); });
  if (!t) { dropLine.remove(); return; }
  t.list.closest('.block').classList.add('drop-on');
  let y = 0;
  if (t.rows.length) { y = t.index < t.rows.length ? t.rows[t.index].offsetTop - 3 : t.rows[t.rows.length - 1].offsetTop + t.rows[t.rows.length - 1].offsetHeight + 1; }
  else dropLine.style.display = 'none';
  if (t.rows.length) dropLine.style.display = '';
  if (dropLine.parentNode !== t.list) t.list.appendChild(dropLine);
  dropLine.style.transform = `translate3d(0,${y}px,0)`;
}
function flyGhost(d, tx, ty, fade, done) {
  const g = d.ghost; if (!g) { done && done(); return; }
  const fx = d.x - d.offX, fy = d.y - d.offY; let nx = fx, ny = fy, fin = 0;
  const end = () => { if (++fin === 2) { g.remove(); done && done(); } };
  if (fade) { g.style.transition = 'opacity .24s .06s'; g.style.opacity = '0'; }
  const upd = () => { g.style.transform = `translate3d(${nx}px,${ny}px,0) scale(${1 + .035 * (d.lift || 0)})`; };
  spring({ from:fx, to:tx, velocity:d.vx, response:.4, damping:.78, onUpdate:v => { nx = v; upd(); }, onDone:end });
  spring({ from:fy, to:ty, velocity:d.vy, response:.4, damping:.78, onUpdate:v => { ny = v; upd(); }, onDone:end });
}
function endDrag(commitIt) {
  const d = D; D = null; cancelAnimationFrame(d.raf);
  d.grip.classList.remove('pressed'); try { d.grip.releasePointerCapture(d.pid); } catch (_) { /* nic */ }
  if (!d.started) return;
  if (d.liftSp) d.liftSp.stop();
  document.body.classList.remove('is-dragging'); dropLine.remove(); $$('.drop-on').forEach(b => b.classList.remove('drop-on'));
  if (commitIt && d.target) {
    const t = d.target; let landed = null, msg = '';
    if (d.kind === 'lib') { const a = ACT[d.aid]; landed = uid(); msg = `Přidáno do bloku „${TYPES[t.block].block}“: ${a.name}`; commit(msg, p => { p[t.block].splice(Math.min(t.index, p[t.block].length), 0, { uid:landed, id:d.aid, min:a.min }); }); }
    else { landed = d.uid; commit('', p => { const f = findItem(p, d.uid); if (!f) return; p[f.b].splice(f.i, 1); p[t.block].splice(Math.min(t.index, p[t.block].length), 0, f.it); }); }
    $$('.is-src').forEach(n => n.classList.remove('is-src'));
    const el = $(`.arow[data-uid="${landed}"]`);
    if (el) { el.style.visibility = 'hidden'; const r = el.getBoundingClientRect(); flyGhost(d, r.left, r.top, true, () => { el.style.visibility = ''; el.classList.add('landed'); }); }
    else d.ghost.remove();
  } else {
    const r = d.src.getBoundingClientRect();
    flyGhost(d, r.left, r.top, false, () => { d.src.classList.remove('is-src'); });
  }
}
/* klávesnice: šipky na úchytu přeřadí aktivitu v bloku */
document.addEventListener('keydown', e => {
  const grip = e.target.closest && e.target.closest('.arow [data-grip]'); if (!grip) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); moveByKey(grip.closest('.arow').dataset.uid, e.key === 'ArrowUp' ? -1 : 1); }
});

/* ---------- delegované události ---------- */
document.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest('.tap'); if (!t) return;
  t.classList.add('pressed');
  const off = () => { t.classList.remove('pressed'); ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => t.removeEventListener(n, off)); };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(n => t.addEventListener(n, off));
}, { passive:true });
document.addEventListener('touchstart', () => {}, { passive:true });      /* aktivuje :active v iOS Safari */

document.addEventListener('click', e => {
  const el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (el.tagName === 'INPUT') return;                                      /* přepínače řeší change */
  switch (a) {
    case 'tab': setTab(el.dataset.t); break;
    case 'group': setGroup(el.dataset.g); break;
    case 'detail': openSheet(el.dataset.id, el); break;
    case 'sheet-close': closeSheet(); break;
    case 'sheet-add': { const a2 = ACT[SH.id]; closeSheet(); addActivity(SH.id, a2.type); break; }
    case 'add': addActivity(el.dataset.id); break;
    case 'remove': {
      const p = plan(), f = findItem(p, el.dataset.uid); if (!f) break;
      const name = ACT[f.it.id].name; commit(`Odebráno: ${name}`, q => { const x = findItem(q, el.dataset.uid); if (x) q[x.b].splice(x.i, 1); }); break;
    }
    case 'min': changeMin(el.dataset.uid, +el.dataset.d); break;
    case 'equalize': { const b = el.dataset.b; commit('', p => equalizeItems(p[b], targetOf(p, b))); break; }
    case 'gamelen': { const v = +el.dataset.v; commit('', p => { p.gameLen = v; }); break; }
    case 'suggest': doSuggest(); break;
    case 'clear': doClear(); break;
    case 'save': doSave(); break;
    case 'load': doLoad(el.dataset.id); break;
    case 'del-saved': doDelSaved(el.dataset.id); break;
    case 'goto-picker': gotoPicker(el.dataset.type); break;
    case 'pick-type': state.pickType = el.dataset.v; persist(); renderPicker(); break;
    case 'lib-type': state.libType = el.dataset.v; persist(); renderLib(); break;
    case 'lib-skill': state.libSkill = el.dataset.v; persist(); renderLib(); break;
    case 'open-week': openWeek(+el.dataset.w); break;
    case 'toast-undo': { const u = toastUndo; toastUndo = null; hideToast(); if (u) u(); break; }
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest && e.target.closest('[data-act]'); if (!el) return;
  if (el.dataset.act === 'show-other') { state.showOther = el.checked; persist(); if (state.tab === 'knihovna') renderLib(); else renderPicker(); }
  if (el.dataset.act === 'done') { state.done[state.group][+el.dataset.w] = el.checked; persist(); renderPlan(); renderNext(); }
});
document.addEventListener('click', e => {
  const sm = e.target.closest && e.target.closest('.phase > summary'); if (!sm) return;
  const d = sm.parentNode;
  setTimeout(() => { state.phaseOpen[state.group][+d.dataset.ph] = d.open; persist(); }, 0);
});
$('#notes').addEventListener('input', e => { plan().notes = e.target.value; persist(); });
$('#saveName').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSave(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) renderNext(); });

/* výška hlavičky pro sticky sloupec */
const hdrObs = () => document.documentElement.style.setProperty('--hdr-h', headerH() + 'px');
if ('ResizeObserver' in window) new ResizeObserver(hdrObs).observe($('#hdr')); hdrObs();

/* ---------- start ---------- */
if (!hadStored) { // první spuštění: předvyber skupinu, jejíž trénink je nejblíž
  const a = nextSession(GROUPS.ut).start, b = nextSession(GROUPS.pa).start; state.group = a <= b ? 'ut' : 'pa';
}
renderAll();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
